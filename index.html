<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" type="image/png" href="assets/icon-32.png" />
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f24">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div id="app">
  <header id="topbar">
    <div class="who">
      <div class="alias" id="tbAlias">Recrue</div>
      <div class="grade" id="tbGrade">Stagiaire · Acte 1</div>
    </div>
    <span class="chip credits" id="tbCredits"></span>
    <span class="chip streak" id="tbStreak"></span>
    <button id="soundBtn" aria-label="Son"></button>
  </header>
  <main id="main">
    <!-- CONNEXION -->
    <section class="view" id="view-auth">
      <div class="authwrap">
        <img class="authlogo" src="assets/logo-nexus-guardian.png" alt="Logo Nexus Guardian" />
        <div class="authname">Nexus Guardian</div>
        <p class="sub" style="text-align:center">Nexus City, 2035. La nuit commence.</p>
        <div class="authtoggle" role="group" aria-label="Connexion ou inscription">
          <button type="button" id="tabLogin" class="on">Se connecter</button>
          <button type="button" id="tabSignup">Créer mon compte</button>
        </div>
        <form id="authForm" novalidate>
          <div class="field"><label for="authEmail">E-mail</label><input id="authEmail" type="email" autocomplete="email" inputmode="email" placeholder="ton@e-mail.fr" /></div>
          <div class="field"><label for="authPass">Mot de passe</label><div class="passwrap"><input id="authPass" type="password" autocomplete="current-password" placeholder="Ton mot de passe" /><button type="button" id="authTogglePass" class="pass-toggle" aria-label="Afficher le mot de passe" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <p class="autherr" id="authErr" role="alert"></p>
          <button class="btn primary big" id="authGo" type="submit">Se connecter</button>
        </form>
        <button class="authlink" id="authForgot" type="button">Mot de passe oublié ?</button>
        <p class="authmsg" id="authMsg"></p>
      </div>
    </section>
    <!-- ACCUEIL -->
    <section class="view" id="view-hub"></section>
    <!-- MISSIONS -->
    <section class="view" id="view-missions"></section>
    <!-- PROFIL -->
    <section class="view" id="view-profil"></section>
    <!-- MENU -->
    <section class="view" id="view-menu"></section>
    <!-- FONCTIONNEMENT -->
    <section class="view" id="view-help"></section>
    <!-- BRIEFING -->
    <section class="view" id="view-briefing"></section>
    <!-- JEU TRI -->
    <section class="view" id="view-tri"></section>
    <!-- JEU PHISHING -->
    <section class="view" id="view-phish"></section>
    <!-- JEU DEFENSE -->
    <section class="view" id="view-defense"></section>
    <section class="view" id="view-forensics"></section>
    <!-- DEBRIEF -->
    <section class="view" id="view-debrief"></section>
    <!-- COLD OPEN -->
    <section class="view" id="view-cold"></section>
    <!-- EPREUVE DIFFEREE -->
    <section class="view" id="view-delayed"></section>
    <!-- MINI-CAMPAGNE -->
    <section class="view" id="view-campaign"></section>
    <!-- PACK SECURITY+ -->
    <section class="view" id="view-pack"></section>
    <!-- DOJO -->
    <section class="view" id="view-dojo"></section>
    <!-- DEVOPS -->
    <section class="view" id="view-devops"></section>
  </main>
  <nav id="bottomnav">
    <span id="navlamp"><span class="navcone"></span></span>
    <button data-nav="hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Accueil</button>
    <button data-nav="missions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>Missions</button>
    <button data-nav="dojo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21.5v-17"/><path d="M5 5c4-2.2 7 2 12 .3v8.9c-5 1.7-8-2.5-12-.3"/></svg>Dojo</button>
    <button data-nav="devops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>DevOps</button>
    <button data-nav="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></svg>Profil</button>
    <button data-nav="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
  </nav>
</div>
